    <rect x="150" y="300" width="42" height="15" rx="7" fill="#fdc180"/>
    <rect x="96" y="308" width="34" height="14" rx="7" fill="#fdc180"/>
    <rect x="118" y="342" width="15" height="38" rx="6" fill="#274a8a" transform="rotate(14 125 360)"/>
    <rect x="140" y="342" width="15" height="38" rx="6" fill="#274a8a" transform="rotate(-16 148 360)"/>
    <rect x="122" y="258" width="34" height="34" rx="9" fill="#fdc180"/>
    <path d="M128 268 l8 5 M156 268 l-8 5" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <rect x="131" y="275" width="5" height="9" rx="2.5" fill="#1a1a1a"/>
    <rect x="144" y="275" width="5" height="9" rx="2.5" fill="#1a1a1a"/>
    <path d="M133 290 q7 -4 14 0" stroke="#1a1a1a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
