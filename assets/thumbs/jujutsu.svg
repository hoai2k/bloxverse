    <rect x="300" y="292" width="34" height="44" rx="6" fill="#22262a"/>
    <rect x="288" y="296" width="14" height="38" rx="6" fill="#f5cd30" transform="rotate(36 295 315)"/>
    <rect x="332" y="284" width="14" height="40" rx="6" fill="#f5cd30" transform="rotate(-58 339 304)"/>
    <rect x="302" y="336" width="14" height="36" rx="5" fill="#2d3138"/>
    <rect x="319" y="336" width="14" height="36" rx="5" fill="#2d3138"/>
    <rect x="302" y="256" width="32" height="32" rx="8" fill="#f5cd30"/>
    <rect x="309" y="266" width="5" height="9" rx="2.5" fill="#1a1a1a"/>
    <rect x="322" y="266" width="5" height="9" rx="2.5" fill="#1a1a1a"/>
    <path d="M311 280 q6 4 13 0" stroke="#1a1a1a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </g>
