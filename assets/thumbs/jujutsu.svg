    <rect x="104" y="190" width="12" height="12"/><rect x="132" y="220" width="12" height="12"/><rect x="104" y="260" width="12" height="12"/>
    <rect x="344" y="180" width="12" height="12"/><rect x="374" y="210" width="12" height="12"/><rect x="344" y="260" width="12" height="12"/>
    <rect x="440" y="240" width="12" height="12"/><rect x="470" y="280" width="12" height="12"/>
