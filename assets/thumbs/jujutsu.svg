  <circle cx="368" cy="200" r="86" fill="none" stroke="#c084fc" stroke-width="5" opacity="0.6"/>
  <circle cx="368" cy="200" r="104" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.3"/>
  <!-- caster figure (right) -->
