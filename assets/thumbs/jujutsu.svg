  <rect x="26" y="26" width="250" height="52" rx="12" fill="rgba(0,0,0,0.45)"/>
  <text x="46" y="61" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#e9d5ff">JUJUTSU ⚡</text>
