    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e7c6ff"/><stop offset="0.55" stop-color="#a855f7"/><stop offset="1" stop-color="#6b21a8"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- city silhouette -->
  <g fill="#1e1436">
    <rect x="0" y="220" width="80" height="292"/><rect x="90" y="170" width="70" height="342"/>
    <rect x="330" y="150" width="80" height="362"/><rect x="420" y="210" width="92" height="302"/>
  </g>
  <g fill="#f5d76e" opacity="0.75">
