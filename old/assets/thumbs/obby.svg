    <ellipse cx="420" cy="70" rx="56" ry="20"/><ellipse cx="380" cy="86" rx="36" ry="16"/>
    <ellipse cx="330" cy="420" rx="70" ry="24"/><ellipse cx="120" cy="460" rx="80" ry="26"/>
  </g>
  <!-- lava bottom -->
  <rect x="0" y="486" width="512" height="26" fill="#e03131"/>
  <path d="M0 486 q32 -14 64 0 q32 14 64 0 q32 -14 64 0 q32 14 64 0 q32 -14 64 0 q32 14 64 0 q32 -14 64 0 q32 14 64 0 v26 h-512z" fill="#c92a2a"/>
  <!-- platforms spiral -->
  <g stroke-width="0">
    <rect x="60" y="430" width="90" height="26" rx="6" fill="#ff6b6b"/>
    <rect x="190" y="386" width="80" height="26" rx="6" fill="#ffa94d"/>
    <rect x="310" y="340" width="80" height="26" rx="6" fill="#ffd43b"/>
    <rect x="200" y="288" width="80" height="26" rx="6" fill="#e03131"/>
    <rect x="90" y="238" width="80" height="26" rx="6" fill="#69db7c"/>
    <rect x="210" y="188" width="80" height="26" rx="6" fill="#4dabf7"/>
    <rect x="330" y="150" width="80" height="26" rx="6" fill="#da77f2"/>
  </g>
  <!-- kill brick glow -->
