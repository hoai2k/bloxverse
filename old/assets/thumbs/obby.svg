  <rect x="206" y="292" width="68" height="8" rx="4" fill="#ff8787" opacity="0.8"/>
  <!-- spinner -->
  <g transform="translate(250 176)">
    <rect x="-64" y="-7" width="128" height="14" rx="7" fill="#e03131" transform="rotate(24)"/>
    <circle r="10" fill="#862e2e"/>
  </g>
  <!-- summit flag -->
  <rect x="368" y="96" width="7" height="56" fill="#dee2e6"/>
  <polygon points="375,96 428,110 375,124" fill="#ffd43b"/>
  <!-- jumping runner -->
  <g transform="rotate(8 150 340)">
