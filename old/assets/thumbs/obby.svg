  <rect x="26" y="26" width="240" height="52" rx="12" fill="rgba(0,0,0,0.4)"/>
  <text x="46" y="61" font-family="Arial, sans-serif" font-size="29" font-weight="900" fill="#fff">SKY OBBY ☁️</text>
