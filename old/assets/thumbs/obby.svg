    <rect x="112" y="306" width="14" height="40" rx="6" fill="#f2b8c6" transform="rotate(34 119 326)"/>
    <rect x="166" y="306" width="14" height="40" rx="6" fill="#f2b8c6" transform="rotate(-34 173 326)"/>
    <rect x="128" y="374" width="15" height="34" rx="6" fill="#22262a" transform="rotate(18 135 391)"/>
    <rect x="150" y="374" width="15" height="34" rx="6" fill="#22262a" transform="rotate(-22 157 391)"/>
    <rect x="129" y="294" width="34" height="34" rx="9" fill="#f2b8c6"/>
    <rect x="137" y="304" width="5" height="9" rx="2.5" fill="#1a1a1a"/>
    <rect x="150" y="304" width="5" height="9" rx="2.5" fill="#1a1a1a"/>
